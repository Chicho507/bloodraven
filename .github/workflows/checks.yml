name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: for file in app/static/*.js; do node --check "$file"; done
      - run: docker build -t bloodraven:check .
      - name: Prepare isolated demo deployment
        run: python scripts/configure.py < /dev/null
      - name: Start complete HTTPS deployment
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify HTTPS login and persisted inventory
        run: |
          docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/bloodraven-root.crt
          python scripts/smoke.py /tmp/bloodraven-root.crt
      - name: Stop isolated deployment
        if: always()
        run: docker compose down
      - name: Build optional Cloudflare DNS module
        run: docker build -t bloodraven-caddy-cloudflare:2.11.4 deploy/caddy
      - name: Check private TLS profile and configuration without external network
        env:
          BR_HOSTNAME: monitor.example.com
          BR_BIND_IP: 127.0.0.1
        run: |
          mkdir -p secrets
          printf '%s' 'fake-cloudflare-ci-token-never-used-online' > secrets/cloudflare_api_token
          python scripts/check_tls_compose.py
          docker run --rm --network none -e BR_HOSTNAME=monitor.example.com \
            -v "$PWD/secrets/cloudflare_api_token:/run/secrets/cloudflare_api_token:ro" \
            bloodraven-caddy-cloudflare:2.11.4 \
            caddy validate --config /etc/caddy/Caddyfile.cloudflare --adapter caddyfile
