name: bloodraven
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BR_DATA_DIR: /data
      BR_INVENTORY: /opt/bloodraven/config/devices.yml
    volumes:
      - measurements:/data
      - ./config/devices.yml:/opt/bloodraven/config/devices.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      BR_HOSTNAME: ${BR_HOSTNAME:-localhost}
    ports:
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  measurements:
  caddy_data:
  caddy_config:
